name: Terraform CI/CD

on:
  push:
    branches:
      - feature
      - main

jobs:

  # ==========================================
  # FEATURE BRANCH - PLAN ONLY
  # ==========================================
  terraform-plan:
    name: Terraform Plan - Feature
    if: github.ref == 'refs/heads/feature'
    runs-on: ubuntu-latest

    

    steps:

      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "a5d71c05-75a6-4a49-85dd-724dbe6e7a78",
              "clientSecret": "EoK8Q~HLbxv5rUuEV44fIzJ~1GAtkmR.qs-DNa3a",
              "subscriptionId": "d4fb712a-aae3-49cf-8c1b-9ed8f8b11a56",
              "tenantId": "8dd47890-014e-4d4a-9706-c08392fd00d0"
            }

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Init
      - name: Terraform Init
        run: terraform init

      # Validate
      - name: Terraform Validate
        run: terraform validate

      # Plan
      - name: Terraform Plan
        run: terraform plan


  # ==========================================
  # MAIN BRANCH - APPLY
  # ==========================================
  terraform-apply:
    name: Terraform Apply - Main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest



    steps:

      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login FIRST
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "a5d71c05-75a6-4a49-85dd-724dbe6e7a78",
              "clientSecret": "EoK8Q~HLbxv5rUuEV44fIzJ~1GAtkmR.qs-DNa3a",
              "subscriptionId": "d4fb712a-aae3-49cf-8c1b-9ed8f8b11a56",
              "tenantId": "8dd47890-014e-4d4a-9706-c08392fd00d0"
            }

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Init
      - name: Terraform Init
        run: terraform init

      # Validate
      - name: Terraform Validate
        run: terraform validate

      # Plan
      - name: Terraform Plan
        run: terraform plan

      # Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve